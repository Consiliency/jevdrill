name: EXPERIMENT offline boundaries
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: npm ci
      - run: uv run python -m pytest -q tests/experiments tests/promotion tests/evaluation/test_policy_evaluation.py tests/verification
      - run: uv run python scripts/verify_discovery_calibration.py --offline-only
      # Native installed companion and actual Linux runtime receipts are explicit
      # separately configured collections; this diagnostic produces no phase gate.
