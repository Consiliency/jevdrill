# HOST phase verification (plans/phase-plan-v1-HOST.md, SL-3 and J1). Dispatched by hand with
# the commit evidence/HOST/adapter-handoff.json names; it calls no model and uses no secret.
# Each native job collects one receipt with the companion at that commit; the reduction accepts
# the three receipts of this run only, and its verdict is this run's artifact.
name: HOST verification

on:
  workflow_dispatch:
    inputs:
      companion_ref:
        description: Full 40-hex Consiliency/agent-harness commit; must be the handoff's commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: Linux}
          - {os: macos-latest, platform: Darwin}
          - {os: windows-latest, platform: Windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The input reaches this step only as an environment variable, before any other use.
      - name: Require the handoff's commit
        shell: bash
        env:
          COMPANION_REF: ${{ inputs.companion_ref }}
        run: |
          expected="$(sed -n 's/^ *"commit": *"\([0-9a-f]\{40\}\)",\{0,1\} *$/\1/p' evidence/HOST/adapter-handoff.json)"
          if [[ ! "$COMPANION_REF" =~ ^[0-9a-f]{40}$ ]] || [ -z "$expected" ] || [ "$COMPANION_REF" != "$expected" ]; then
            echo "::error::companion_ref must be the full commit SHA that evidence/HOST/adapter-handoff.json names" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Consiliency/agent-harness
          ref: ${{ inputs.companion_ref }}
          path: .host/companion
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.14'}
      - run: uv sync --locked
      - run: npm ci
      # The companion's own install (HOST plan, R6) on the Python its CI tests (J7).
      - run: uv sync --project .host/companion/phase-loop-runtime --group test --extra visual --locked --python 3.12
      - id: companion
        shell: bash
        env:
          HOST_OS: ${{ runner.os }}
        run: |
          venv="$GITHUB_WORKSPACE/.host/companion/phase-loop-runtime/.venv"
          if [ "$HOST_OS" = "Windows" ]; then
            python="$(cygpath -m "$venv")/Scripts/python.exe"
          else
            python="$venv/bin/python"
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
      - id: compiler
        shell: bash
        run: |
          result="$(uv run python scripts/install_contract_compiler.py --directory "$RUNNER_TEMP/jevdrill-baml")"
          path="$(python -c 'import json, sys; print(json.loads(sys.argv[1])["path"])' "$result")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/verify_host_phase.py --local-only --agent-harness .host/companion
        env:
          BAML_CLI: ${{ steps.compiler.outputs.path }}
          JEVDRILL_AGENT_HARNESS_PYTHON: ${{ steps.companion.outputs.python }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-native-${{ matrix.platform }}
          path: evidence/HOST/platforms/${{ matrix.platform }}-3.14.json
          if-no-files-found: error

  reduce:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Without this a receipt already in the checkout could stand in for a native job that failed.
      - name: Require successful native jobs
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - name: Require the handoff's commit
        shell: bash
        env:
          COMPANION_REF: ${{ inputs.companion_ref }}
        run: |
          expected="$(sed -n 's/^ *"commit": *"\([0-9a-f]\{40\}\)",\{0,1\} *$/\1/p' evidence/HOST/adapter-handoff.json)"
          if [[ ! "$COMPANION_REF" =~ ^[0-9a-f]{40}$ ]] || [ -z "$expected" ] || [ "$COMPANION_REF" != "$expected" ]; then
            echo "::error::companion_ref must be the full commit SHA that evidence/HOST/adapter-handoff.json names" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Consiliency/agent-harness
          ref: ${{ inputs.companion_ref }}
          path: .host/companion
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-native-*
          path: evidence/HOST/platforms
          merge-multiple: true
      - id: reduce
        run: uv run python scripts/verify_host_phase.py --reduce-only --agent-harness .host/companion
      # The verdict is uploaded only when the reduction ran (Consiliency/jevdrill#74).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && (steps.reduce.outcome == 'success' || steps.reduce.outcome == 'failure') }}
        with:
          name: host-verification
          path: evidence/HOST/verification.json
          if-no-files-found: error
