# Throwaway timing probe for S5a (president's ruling of 2026-11-21). It lives only on a
# probe branch and is never merged. Delete the branch when the numbers are recorded.
name: S5a timing probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - name: The sink proof alone (its summary line is the file's total)
        run: uv run python -m pytest tests/privacy/test_sink_proof.py -q --durations=5
      - name: The CLI tests, with durations
        if: always()
        run: uv run python -m pytest tests/cli/test_cli.py -q --durations=20
      - name: What the judge does before it dispatches, then ten runs of its tests
        if: always()
        run: uv run python probe/s5a_probe.py 10
      - name: The whole unit command once, with durations
        if: always()
        run: uv run python -m pytest tests/storage tests/catalog tests/discovery tests/inventory tests/context tests/settings tests/routing tests/costing tests/guidance tests/integrations tests/application tests/cli tests/privacy tests/analysis tests/maintenance tests/retention tests/experiments tests/promotion -q --durations=40 --deselect "tests/application/test_learning.py::test_installed_discovery_host_tasks_reports_analysis_and_entered_denials"
