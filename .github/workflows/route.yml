name: ROUTE verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: Linux}
          - {os: macos-latest, platform: Darwin}
          - {os: windows-latest, platform: Windows}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.14'}
      - run: uv sync --locked
      - run: npm ci
      - id: compiler
        shell: bash
        run: |
          result="$(uv run python scripts/install_contract_compiler.py --directory "$RUNNER_TEMP/jevdrill-baml")"
          path="$(python -c 'import json, sys; print(json.loads(sys.argv[1])["path"])' "$result")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/verify_route_phase.py --local-only
        env:
          BAML_CLI: ${{ steps.compiler.outputs.path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: route-native-${{ matrix.os }}
          path: evidence/ROUTE/platforms/${{ matrix.platform }}-3.14.json
          if-no-files-found: error

  reduce:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: route-native-*
          path: evidence/ROUTE/platforms
          merge-multiple: true
      # Without this a receipt already in the checkout could stand in for a native job that failed.
      - name: Require successful native jobs
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - run: uv run python scripts/verify_route_phase.py --reduce-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: route-verification
          path: evidence/ROUTE/verification.json
          if-no-files-found: error
