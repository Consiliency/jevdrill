# Interim: runs the unit tests the stack has landed so far that no phase
# verifier covers yet. Removed when the ROUTE verifier lands and takes over
# (plans/pr1-stack-split-20261119.md, S5).
name: Stack unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run python -m pytest tests/storage tests/catalog tests/inventory tests/settings tests/routing tests/costing tests/guidance tests/context tests/privacy tests/integrations tests/experiments tests/promotion -q
      - run: uv run python -m ruff check tests/storage tests/catalog tests/inventory tests/settings tests/routing tests/costing tests/guidance tests/context tests/privacy tests/integrations tests/experiments tests/promotion
      - run: uv run python -m ruff format --check tests/storage tests/catalog tests/inventory tests/settings tests/routing tests/costing tests/guidance tests/context tests/privacy tests/integrations tests/experiments tests/promotion
