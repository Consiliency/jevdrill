# Runs every test directory in testpaths on the three platforms, except tests/contracts
# and tests/evaluation, which need the pinned compiler and run in contracts.yml and route.yml.
# It replaces the interim stack-unit.yml of the stack split (plans/pr1-stack-split-20261119.md).
name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      # The deselected test needs the HOST companion checkout; the LEARN verifier runs it (S6).
      # Test files go under the runner's temp directory: the default one on Windows is on the
      # slow system disk. The durations show where a slow run spent its time.
      - run: uv run python -m pytest tests/storage tests/catalog tests/discovery tests/inventory tests/context tests/settings tests/routing tests/costing tests/guidance tests/integrations tests/application tests/cli tests/privacy tests/verification tests/analysis tests/maintenance tests/retention tests/experiments tests/promotion -q --durations=25 --basetemp="${{ runner.temp }}/pytest" --deselect "tests/application/test_learning.py::test_installed_discovery_host_tasks_reports_analysis_and_entered_denials"
      - run: uv run python -m ruff check tests/storage tests/catalog tests/discovery tests/inventory tests/context tests/settings tests/routing tests/costing tests/guidance tests/integrations tests/application tests/cli tests/privacy tests/verification tests/analysis tests/maintenance tests/retention tests/experiments tests/promotion
      - run: uv run python -m ruff format --check tests/storage tests/catalog tests/discovery tests/inventory tests/context tests/settings tests/routing tests/costing tests/guidance tests/integrations tests/application tests/cli tests/privacy tests/verification tests/analysis tests/maintenance tests/retention tests/experiments tests/promotion
